<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maquette – nouvelle version</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6efe4;--ink:#1f2433;--muted:#6b6f7c;--card:#fffaf2;--line:#e8dccb;--accent:#1d3b78;--accent2:#c9a24b;--sky1:#f9e6cf;--sky2:#f3c9a6;--hero-ink:#1f2433}
body.city-ny{--bg:#eef0f5;--card:#fff;--line:#d9dde8;--accent:#c23b3b;--accent2:#f2b632;--sky1:#2b3a67;--sky2:#e88a5b;--hero-ink:#fff}
body.city-tlv{--bg:#f2f7f6;--card:#fff;--line:#d5e6e3;--accent:#0f7c8a;--accent2:#f2a65a;--sky1:#9fd8e6;--sky2:#fdf1d6;--hero-ink:#173a40}
body.city-jer{--bg:#f7f0e3;--card:#fffaf0;--line:#eadcc0;--accent:#8a5a1f;--accent2:#d9a441;--sky1:#f7d9a8;--sky2:#fbeedb;--hero-ink:#3d2a12}
body.prec{--bg:#0f0e0c;--ink:#f3eadb;--muted:#a99e8b;--card:#1a1814;--line:#2e2a22;--accent:#c9a24b;--accent2:#e8cf8a;--hero-ink:#f3eadb}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Manrope,system-ui,sans-serif;transition:background .5s,color .5s;padding-bottom:88px}
h1,h2,h3{font-family:Gloock,Georgia,serif;font-weight:400;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.hero{position:relative;height:330px;overflow:hidden;color:var(--hero-ink)}
.hero svg.scene{position:absolute;inset:0;width:100%;height:100%}
.hero .fade{position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(to bottom,transparent,var(--bg))}
.hero-top{position:relative;z-index:2;padding:max(18px,env(safe-area-inset-top)) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.brand small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;opacity:.75}
.brand h1{font-size:30px;line-height:1.05;margin-top:2px;text-shadow:0 1px 12px rgba(255,255,255,.25)}
body.city-ny .brand h1,body.prec .brand h1{text-shadow:0 2px 14px rgba(0,0,0,.4)}
.ibtn{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.85);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.12);color:#1f2433}
.ibtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ibtn.add{background:var(--accent);color:#fff}
.cities{position:relative;z-index:2;display:flex;gap:8px;padding:14px 16px 0;overflow-x:auto;scrollbar-width:none}
.city{flex:none;border:0;border-radius:999px;padding:8px 14px;font-weight:800;font-size:13px;background:rgba(255,255,255,.72);color:#1f2433;backdrop-filter:blur(6px);display:flex;gap:6px;align-items:center}
.city b{font-weight:800;opacity:.55;font-size:11px}
.city.on{background:var(--accent);color:#fff}
.search{position:relative;z-index:2;margin:14px 16px 0;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.92);border-radius:16px;padding:12px 14px;color:#6b6f7c;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.search input{border:0;background:none;outline:0;font:inherit;flex:1;color:#1f2433}
main{padding:0 16px;position:relative;z-index:3;margin-top:-34px}
.sec{margin:26px 0 0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.sec-h h2{font-size:22px}
.sec-h span{font-size:12px;color:var(--muted);font-weight:700}
.envies{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none;scroll-snap-type:x mandatory}
.envie{flex:none;width:150px;height:180px;border:0;border-radius:22px;padding:14px;text-align:left;color:#fff;position:relative;overflow:hidden;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.envie svg{position:absolute;top:12px;right:12px;width:46px;height:46px;fill:none;stroke:rgba(255,255,255,.9);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.envie h3{font-size:20px;line-height:1.1}
.envie p{margin:4px 0 0;font-size:12px;opacity:.85;font-weight:600}
.diet{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.diet button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:16px;text-align:left;display:flex;gap:12px;align-items:center}
.diet .seal{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:Gloock,serif;font-size:20px;color:#fff;flex:none}
.diet b{display:block;font-size:16px}
.diet small{color:var(--muted);font-weight:700}
.cuis{display:flex;flex-wrap:wrap;gap:8px}
.cuis button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font-weight:700;font-size:13px}
.cuis button i{font-style:normal;color:var(--muted);margin-left:5px;font-weight:600}
.collection{border:0;width:100%;border-radius:24px;padding:22px 20px;text-align:left;color:#f3eadb;background:radial-gradient(120% 140% at 100% 0,#3a2f1b 0,#14120e 60%);position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.collection small{letter-spacing:.2em;text-transform:uppercase;font-size:10px;color:#c9a24b;font-weight:800}
.collection h3{font-size:26px;margin:6px 0 4px;color:#f3eadb}
.collection p{margin:0;color:#c8bba3;font-size:13px;max-width:240px}
.collection .go{margin-top:14px;display:inline-block;border:1px solid #c9a24b;color:#e8cf8a;border-radius:999px;padding:7px 14px;font-weight:800;font-size:12px}
.collection svg{position:absolute;right:-10px;bottom:-10px;width:150px;opacity:.9}
body.prec .collection{outline:1px solid #c9a24b}
.cards{display:flex;flex-direction:column;gap:10px}
.pcard{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;text-align:left;width:100%}
.ph{width:64px;height:64px;border-radius:14px;flex:none;background:var(--accent) center/cover;display:grid;place-items:center;color:#fff;font-family:Gloock,serif;font-size:24px}
.pcard b{display:block;font-size:15px}
.pcard small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.tags{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 6px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.tag.k{background:#e7eefb;color:#1d3b78}.tag.h{background:#e6f3ea;color:#2c7a4b}
body.prec .tag{background:#2a2418;color:#e8cf8a}
.names{display:flex;flex-direction:column;gap:10px}
.name{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px 16px;text-align:left}
.name.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.name h3{font-size:22px}
.name p{margin:3px 0 0;color:var(--muted);font-size:13px}
.note{font-size:12.5px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:10px 12px;margin-top:10px}
.list-h{display:flex;align-items:center;gap:10px;margin:22px 0 12px}
.list-h h2{font-size:24px}
.back{border:1px solid var(--line);background:var(--card);border-radius:50%;width:38px;height:38px}
nav{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:10;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:22px;padding:8px 6px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:4px 8px}
nav button.on{color:var(--accent)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.proto{margin-top:6px;text-align:center;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
</style>
</head>

  const c=CITIES.find(x=>x.id===S.city);
  document.body.className=`city-${S.city}${S.prec?" prec":""}`;
  const count=id=>S.places.filter(p=>cityOf(p)===id).length;
  $("#hero").innerHTML=`${S.prec?SCENES.night:SCENES[c.scene]}<div class="fade"></div>
  <div class="hero-top"><div class="brand"><small>${S.prec?"La Collection":esc(c.greet)}</small><h1>${esc(NAMES[S.name].n)}</h1></div>
  <div style="display:flex;gap:8px"><button class="ibtn" aria-label="Partager"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button><button class="ibtn add" aria-label="Ajouter"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div></div>
  <div class="cities">${CITIES.map(x=>`<button class="city ${x.id===S.city?"on":""}" data-city="${x.id}">${esc(x.name)} <b>${count(x.id)}</b></button>`).join("")}</div>
  <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Un resto, une envie, un quartier…"></label>`;
}
function card(p){const ph=p.photo?`style="background-image:url('${esc(p.photo)}')"`:"";
  return `<div class="pcard"><div class="ph" ${ph}>${p.photo?"":esc((p.name||"?")[0])}</div><div style="min-width:0"><b>${esc(p.name)}</b><small>${esc(p.cat||"")}${p.address?" · "+esc(p.address):""}</small><div class="tags">${p.price?`<span class="tag">${"€".repeat(p.price)}</span>`:""}${p.kasher?'<span class="tag k">Kasher</span>':""}${p.halal?'<span class="tag h">Halal</span>':""}</div></div></div>`}
function renderHome(){
  const P=pool();const c=CITIES.find(x=>x.id===S.city);
  const envies=ENVIES.map((e,i)=>({e,i,n:P.filter(e.f).length})).filter(x=>x.n>0);
  const k=P.filter(p=>p.kasher).length,h=P.filter(p=>p.halal).length;
  const cats=Object.entries(P.reduce((a,p)=>(p.cat&&(a[p.cat]=(a[p.cat]||0)+1),a),{})).sort((a,b)=>b[1]-a[1]).slice(0,16);
  const flower=`<svg viewBox="0 0 120 120"><g fill="none" stroke="#c9a24b" stroke-width="1.2" opacity=".8"><circle cx="80" cy="80" r="40"/><circle cx="80" cy="80" r="28"/><path d="M80 40v80M40 80h80M52 52l56 56M108 52l-56 56"/></g></svg>`;
  $("#main").innerHTML=`<div class="proto">Maquette · ton appli actuelle n'est pas modifiée</div>
  <section class="sec"><div class="sec-h"><h2>Une envie de…</h2><span>${P.length} adresses</span></div>
   <div class="envies">${envies.map(({e,i,n})=>`<button class="envie" style="background:${e.c}" data-envie="${i}"><svg viewBox="0 0 24 24">${ICON[e.i]}</svg><h3>${e.t}</h3><p>${e.s} · ${n}</p></button>`).join("")}</div></section>
  <section class="sec"><div class="sec-h"><h2>Régimes</h2><span>touche pour filtrer</span></div>
   <div class="diet">${k?`<button data-diet="kasher"><span class="seal" style="background:#1d3b78">K</span><span><b>Kasher</b><small>${k} adresses</small></span></button>`:""}
   ${h?`<button data-diet="halal"><span class="seal" style="background:#2c7a4b">H</span><span><b>Halal</b><small>${h} adresses</small></span></button>`:""}</div></section>
  <section class="sec"><button class="collection" data-toggle-prec>${flower}<small>${S.prec?"Tu es dans":"Haut de gamme"}</small><h3>${S.prec?"La Collection":"La Collection "+esc(c.name)}</h3><p>${S.prec?"Toute l'appli passe en noir et or. Touche pour revenir aux adresses du quotidien.":"Les Précieuses : grandes tables, rooftops, bars d'exception. Toute l'appli passe en mode soirée."}</p><span class="go">${S.prec?"Quitter la Collection":"Entrer"}</span></button></section>
  <section class="sec"><div class="sec-h"><h2>Par cuisine</h2></div><div class="cuis">${cats.map(([n,v])=>`<button data-cat="${esc(n)}">${esc(n)}<i>${v}</i></button>`).join("")}</div></section>
  <section class="sec"><div class="sec-h"><h2>Choisis le nom</h2><span>touche pour l'essayer</span></div>
   <div class="names">${NAMES.map((x,i)=>`<button class="name ${i===S.name?"on":""}" data-name="${i}"><h3>${esc(x.n)}</h3><p>${esc(x.d)}</p></button>`).join("")}</div>
   <div class="note">Maquette : touche les villes en haut pour changer d'ambiance, et « Entrer » dans la Collection pour le mode haut de gamme. Les adresses sont les vraies.</div></section>`;
}
function renderList(){
  const P=pool();const L=S.list;let items=P,title="";
  if(L.envie!=null){items=P.filter(ENVIES[L.envie].f);title=ENVIES[L.envie].t}
  if(L.diet){items=P.filter(p=>p[L.diet]);title=L.diet==="kasher"?"Kasher":"Halal"}
  if(L.cat){items=P.filter(p=>p.cat===L.cat);title=L.cat}
  if(L.q){const q=L.q.toLowerCase();items=P.filter(p=>`${p.name} ${p.cat} ${p.address}`.toLowerCase().includes(q));title=`« ${L.q} »`}
  $("#main").innerHTML=`<div class="list-h"><button class="back" data-back>‹</button><h2>${esc(title)}</h2></div><div class="cards">${items.slice(0,80).map(card).join("")||'<p style="color:var(--muted)">Rien ici pour l\'instant.</p>'}</div>`;
}
function renderNav(){
  const it=[["home","Accueil",'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'],["explore","Explorer",'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'],["map","Carte",'<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>'],["love","Mes envies",'<path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/>']];
  $("#nav").innerHTML=it.map(([id,l,ic])=>`<button class="${(S.view===id||(id==="home"&&S.view==="list"))?"on":""}" data-view="${id}"><svg viewBox="0 0 24 24">${ic}</svg>${l}</button>`).join("");
}
function render(){renderHero();S.view==="list"?renderList():renderHome();renderNav()}
document.addEventListener("click",e=>{const t=e.target;let b;
 if(b=t.closest("[data-city]")){S.city=b.dataset.city;S.view="home";render();scrollTo({top:0,behavior:"smooth"});return}
 if(b=t.closest("[data-envie]")){S.list={envie:+b.dataset.envie};S.view="list";render();return}
 if(b=t.closest("[data-diet]")){S.list={diet:b.dataset.diet};S.view="list";render();return}
 if(b=t.closest("[data-cat]")){S.list={cat:b.dataset.cat};S.view="list";render();return}
 if(t.closest("[data-toggle-prec]")){S.prec=!S.prec;render();scrollTo({top:0,behavior:"smooth"});return}
 if(b=t.closest("[data-name]")){S.name=+b.dataset.name;render();return}
 if(t.closest("[data-back]")){S.view="home";render();return}
 if(b=t.closest("[data-view]")){const v=b.dataset.view;if(v==="home"){S.view="home";render()}else if(v==="explore"){S.list={q:""};S.view="list";render()}else alert("Dans la maquette, seuls Accueil et Explorer sont cliquables.");return}
});
document.addEventListener("keydown",e=>{if(e.target.id==="q"&&e.key==="Enter"){S.list={q:e.target.value.trim()};S.view="list";render()}});
fetch("../data/places.json").then(r=>r.json()).then(p=>{S.places=p.filter(x=>!x.removed);render()}).catch(()=>{render()});
render();
</script>
</body>
</html>
