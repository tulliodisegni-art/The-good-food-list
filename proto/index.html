<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maquette – nouvelle version</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f2ea;--ink:#1d2130;--muted:#6d6f78;--card:#fffdf9;--line:#ebe2d4;--chip:#f0e8db;--accent:#1d3b78;--gold:#c9a24b;--shadow:0 6px 20px rgba(40,30,10,.08)}
body.dark{--bg:#121318;--ink:#eeeae2;--muted:#9a9aa3;--card:#1b1d24;--line:#2a2d36;--chip:#23262f;--shadow:0 6px 20px rgba(0,0,0,.35)}
body.city-ny{--accent:#c23b3b}body.city-tlv{--accent:#0f7c8a}body.city-jer{--accent:#a86a1f}
body.dark.city-paris{--accent:#7f9fe0}body.dark.city-ny{--accent:#ff7a6b}body.dark.city-tlv{--accent:#46c1cf}body.dark.city-jer{--accent:#e3a956}
body.prec{--bg:#0d0c0a;--ink:#f3eadb;--muted:#a99e8b;--card:#18160f;--line:#2e2a20;--chip:#221e16;--accent:#c9a24b}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Manrope,system-ui,sans-serif;transition:background .4s,color .4s;padding-bottom:92px;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Gloock,Georgia,serif;font-weight:400;margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hero{position:relative;height:360px;color:#fff;background:#2a2a2a center/cover no-repeat;transition:background-image .4s}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0,rgba(0,0,0,.08) 38%,rgba(0,0,0,.15) 62%,var(--bg) 100%)}
.hero>*{position:relative;z-index:2}
.top{padding:max(16px,env(safe-area-inset-top)) 16px 0;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.brand small{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;opacity:.9}
.brand h1{font-size:34px;line-height:1.02;margin-top:3px;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.acts{display:flex;gap:8px}
.ibtn{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;color:#fff}
.ibtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ibtn.add{background:#fff;color:#1d2130}
.cities{display:flex;gap:8px;padding:16px 16px 0;overflow-x:auto;scrollbar-width:none}
.cities::-webkit-scrollbar,.rail::-webkit-scrollbar{display:none}
.city{flex:none;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px;background:rgba(0,0,0,.18);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.city b{opacity:.7;font-size:11px;margin-left:4px}
.city.on{background:#fff;color:#1d2130;border-color:#fff}
.search{margin:14px 16px 0;display:flex;gap:8px;align-items:center;background:var(--card);border-radius:16px;padding:12px 14px;color:var(--muted);box-shadow:var(--shadow)}
.search input{border:0;background:none;outline:0;font:inherit;flex:1;color:var(--ink)}
.credit{position:absolute;right:10px;bottom:62px;font-size:9px;opacity:.6;z-index:2}
main{padding:0 16px;position:relative;z-index:3}
.sec{margin-top:26px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.sec-h h2{font-size:23px}
.sec-h .all{border:0;background:none;color:var(--accent);font-weight:800;font-size:13px;padding:0}
.sec-h span{font-size:12px;color:var(--muted);font-weight:700}
.rail{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.tile{flex:none;border:0;border-radius:20px;padding:0;text-align:left;color:#fff;position:relative;overflow:hidden;scroll-snap-align:start;background:#444 center/cover;box-shadow:var(--shadow)}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.72))}
.tile .t{position:absolute;left:14px;right:12px;bottom:12px;z-index:2}
.tile h3{font-size:20px;line-height:1.1}
.tile p{margin:3px 0 0;font-size:12px;font-weight:700;opacity:.9}
.envie{width:158px;height:200px}
.cuis{width:132px;height:150px}.cuis h3{font-size:17px}
.zones{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.zone{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:10px 6px 8px;text-align:center;box-shadow:var(--shadow)}
.zone b{display:block;font-family:Gloock,serif;font-weight:400;font-size:22px;line-height:1;color:var(--accent)}
.zone b sup{font-size:11px}
.zone small{display:block;color:var(--muted);font-size:11px;font-weight:700;margin-top:3px}
.zones.wide{grid-template-columns:1fr 1fr}
.zones.wide .zone{text-align:left;padding:14px}
.zones.wide .zone b{font-size:20px}
.diet{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.diet button{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px;text-align:left;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.seal{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:Gloock,serif;font-size:19px;color:#fff;flex:none}
.diet b{display:block}.diet small{color:var(--muted);font-weight:700}
.collection{border:0;width:100%;height:190px;border-radius:24px;padding:0;text-align:left;color:#f3eadb;position:relative;overflow:hidden;background:#14120e center/cover;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.collection::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,9,7,.88) 0,rgba(10,9,7,.55) 60%,rgba(10,9,7,.2))}
.collection .t{position:absolute;inset:auto 18px 18px 18px;z-index:2}
.collection small{letter-spacing:.2em;text-transform:uppercase;font-size:10px;color:#e0c06f;font-weight:800}
.collection h3{font-size:26px;margin:4px 0}
.collection p{margin:0;color:#d6cab3;font-size:13px;max-width:250px}
.collection .go{display:inline-block;margin-top:10px;border:1px solid #c9a24b;color:#e8cf8a;border-radius:999px;padding:6px 14px;font-weight:800;font-size:12px}
.subhead{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.subhead h3{font-size:19px;color:var(--sc,var(--accent))}
.subhead i{flex:1;height:1px;background:var(--line)}
.subhead span{font-size:12px;font-weight:800;color:var(--muted)}
.cards{display:flex;flex-direction:column;gap:10px}
.pcard{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:var(--shadow)}
.ph{width:62px;height:62px;border-radius:14px;flex:none;background:var(--chip) center/cover;display:grid;place-items:center;color:var(--accent);font-family:Gloock,serif;font-size:24px}
.pcard b{display:block}
.pcard small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.tags{display:flex;gap:5px;margin-top:4px}
.tag{font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 6px;background:var(--chip);color:var(--ink)}
.tag.k{background:#e3ebfb;color:#1d3b78}.tag.h{background:#e2f2e7;color:#2c7a4b}
.list-h{display:flex;align-items:center;gap:12px;margin:20px 0 6px}
.list-h h2{font-size:26px}
.back{border:1px solid var(--line);background:var(--card);border-radius:50%;width:38px;height:38px;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .tile{width:auto;height:130px}
.names{display:flex;flex-direction:column;gap:10px}
.name{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:13px 16px;text-align:left;box-shadow:var(--shadow)}
.name.on{box-shadow:0 0 0 2px var(--accent) inset}
.name h3{font-size:22px}.name p{margin:2px 0 0;color:var(--muted);font-size:13px}
.proto{margin:14px 0 0;text-align:center;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
nav{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:10;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:8px 6px;box-shadow:0 8px 28px rgba(0,0,0,.14)}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:4px 8px}
nav button.on{color:var(--accent)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body class="city-paris">
<header class="hero" id="hero"></header>
<main id="main"></main>
<nav id="nav"></nav>
<script>
const CITIES=[
 {id:"paris",name:"Paris",kick:"Ce soir à Paris",zoneTitle:"Par arrondissement"},
 {id:"ny",name:"New York",kick:"Tonight in New York",zoneTitle:"Par quartier"},
 {id:"tlv",name:"Tel-Aviv",kick:"Ce soir à Tel-Aviv",zoneTitle:"Par quartier"},
 {id:"jer",name:"Jérusalem",kick:"Ce soir à Jérusalem",zoneTitle:"Par quartier"}];
const NAMES=[
 {n:"First Bite",d:"« Love at first bite » : le coup de foudre dès la première bouchée."},
 {n:"Crush",d:"Ton coup de cœur, en un mot. Court, chic, ça donne envie."},
 {n:"Smitten",d:"« Fou amoureux » en anglais. Pour les adresses qui font craquer."},
 {n:"Table Crush",d:"Le crush, mais pour une table."},
 {n:"Craving",d:"L'envie irrésistible d'aller manger quelque part."},
 {n:"Hungry Heart",d:"Le cœur et l'appétit, ensemble."},
 {n:"Bite Club",d:"Clin d'œil à Fight Club : le cercle des bonnes adresses."},
 {n:"Fork & Flame",d:"La fourchette et la flamme du coup de foudre."}];
const ENVIES=[
 {t:"Petit prix",s:"Bon et pas cher",f:p=>p.price<=1},
 {t:"Grande occasion",s:"Pour marquer le coup",f:p=>p.price>=4},
 {t:"Entre amis",s:"Ça bouge, on partage",f:p=>/Soirée|festif|Bar|Tapas|Rooftop/.test(p.cat||"")},
 {t:"Sur le pouce",s:"Vite fait, bien fait",f:p=>/Street|Burger|Pâtisserie|Sandwich|Glacier|Deli/.test(p.cat||"")},
 {t:"Brunch & café",s:"Le dimanche matin",f:p=>/Brunch|Café/.test(p.cat||"")},
 {t:"Envie d'Asie",s:"Japon, Corée, Chine…",f:p=>/Japonais|Coréen|Chinois|Thaï|Vietnam|Asiat|Taïwan/.test(p.cat||"")},
 {t:"Dolce vita",s:"Pâtes, pizzas, burrata",f:p=>/Italien/.test(p.cat||"")}];
const CREDIT={paris:"Photo Terragio67, CC BY-SA 4.0",ny:"Photo King of Hearts, CC BY-SA 4.0",tlv:"Photo Shaulinb, CC BY-SA 3.0",jer:"Photo Radosław Botev, CC BY 3.0",nuit:"Photo Pierre Blaché, CC0"};
const PAL=["#1d3b78","#2c7a4b","#c23b3b","#d0782a","#7a4ea3","#0f7c8a","#a86a1f","#b03a6f"];
const S={city:"paris",prec:false,dark:matchMedia("(prefers-color-scheme: dark)").matches,view:"home",list:null,name:0,places:[]};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const arrH=n=>n===1?"1<sup>er</sup>":`${n}<sup>e</sup>`;
const cityOf=p=>p.list==="villes"?({"New York":"ny","Tel-Aviv":"tlv","Jérusalem":"jer","Autour de Paris":"paris"}[p.city]||"other"):"paris";
const isPrec=p=>p.list==="precieuses"||!!p.prec||(p.list==="villes"&&p.price>=4);
function zoneOf(p){const a=p.address||"";
 if(cityOf(p)==="paris")return p.list==="villes"?"Autour de Paris":(p.arr?String(p.arr):"");
 if(p.city==="New York"){if(/Brooklyn/i.test(a))return"Brooklyn";if(/Queens|Flushing|Astoria|Long Island City|Jackson Heights/i.test(a))return"Queens";if(/Bronx/i.test(a))return"Bronx";if(/Staten/i.test(a))return"Staten Island";return a&&a!=="New York"?"Manhattan":""}
 if(p.city==="Tel-Aviv"){if(/Jaffa|Yafo|HaDolfin/i.test(a))return"Jaffa";if(/Ramat Gan/i.test(a))return"Ramat Gan";if(/Herzliya/i.test(a))return"Herzliya";return"Centre"}
 if(p.city==="Jérusalem")return/Vieille ville|Old City/i.test(a)?"Vieille ville":"Centre-ville";return""}
const pool=()=>S.places.filter(p=>cityOf(p)===S.city&&(S.prec?isPrec(p):p.list!=="precieuses"));
const photoOf=(arr,seed=0)=>{const w=arr.filter(p=>p.photo&&!/logo|icon|favicon|\.svg/i.test(p.photo));return w.length?w[seed%w.length].photo:""};
const bg=u=>u?`style="background-image:url('${esc(u)}')"`:"";
function renderHero(){const c=CITIES.find(x=>x.id===S.city);
 document.body.className=`city-${S.city}${S.dark?" dark":""}${S.prec?" prec":""}`;
 const img=S.prec?"../images/cities/nuit.jpg":`../images/cities/${S.city}.jpg`;
 const h=$("#hero");h.style.backgroundImage=`url('${img}')`;
 const n=id=>S.places.filter(p=>cityOf(p)===id&&p.list!=="precieuses").length;
 h.innerHTML=`<div class="top"><div class="brand"><small>${S.prec?"La Collection":esc(c.kick)}</small><h1>${esc(NAMES[S.name].n)}</h1></div>
 <div class="acts"><button class="ibtn" data-dark aria-label="Mode sombre"><svg viewBox="0 0 24 24">${S.dark?'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/>':'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>'}</svg></button>
 <button class="ibtn" aria-label="Partager"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button>
 <button class="ibtn add" aria-label="Ajouter"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div></div>
 <div class="cities">${CITIES.map(x=>`<button class="city ${x.id===S.city?"on":""}" data-city="${x.id}">${esc(x.name)}<b>${n(x.id)}</b></button>`).join("")}</div>
 <span class="credit">${esc(CREDIT[S.prec?"nuit":S.city])}</span><label class="search" style="position:absolute;left:0;right:0;bottom:-6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Un resto, une envie, un quartier…"></label>`;}
function card(p){return `<div class="pcard"><div class="ph" ${bg(p.photo)}>${p.photo?"":esc((p.name||"?")[0])}</div><div style="min-width:0"><b>${esc(p.name)}</b><small>${esc(p.cat||"")}${p.address?" · "+esc(p.address.replace(/,?\s*750\d\d Paris$/,"")):""}</small><div class="tags">${p.price?`<span class="tag">${"€".repeat(p.price)}</span>`:""}${p.kasher?'<span class="tag k">Kasher</span>':""}${p.halal?'<span class="tag h">Halal</span>':""}</div></div></div>`}
function zones(P){const m={};P.forEach(p=>{const z=zoneOf(p);if(z)m[z]=(m[z]||0)+1});return m}
function renderHome(){const P=pool(),c=CITIES.find(x=>x.id===S.city);
 const env=ENVIES.map((e,i)=>({e,i,items:P.filter(e.f)})).filter(x=>x.items.length);
 const Z=zones(P);const paris=S.city==="paris";
 const zkeys=paris?[...Array.from({length:20},(_,i)=>String(i+1)).filter(k=>Z[k]),...(Z["Autour de Paris"]?["Autour de Paris"]:[])]:Object.keys(Z).sort((a,b)=>Z[b]-Z[a]);
 const cats=Object.entries(P.reduce((a,p)=>(p.cat&&(a[p.cat]=(a[p.cat]||0)+1),a),{})).sort((a,b)=>b[1]-a[1]);
 const k=P.filter(p=>p.kasher).length,h=P.filter(p=>p.halal).length;
 const precImg=photoOf(S.places.filter(p=>cityOf(p)===S.city&&isPrec(p)),3)||"../images/cities/nuit.jpg";
 $("#main").innerHTML=`<div style="height:34px"></div>
 <section class="sec"><div class="sec-h"><h2>${esc(c.zoneTitle)}</h2><span>${P.length} adresses</span></div>
  <div class="zones ${paris?"":"wide"}">${zkeys.map(z=>`<button class="zone" data-zone="${esc(z)}"><b ${paris&&!/^\d+$/.test(z)?'style="font-size:13px;line-height:1.2"':""}>${paris&&/^\d+$/.test(z)?arrH(+z):esc(z)}</b><small>${Z[z]} adresse${Z[z]>1?"s":""}</small></button>`).join("")}</div></section>
 <section class="sec"><div class="sec-h"><h2>Une envie de…</h2></div>
  <div class="rail">${env.map(({e,i,items})=>`<button class="tile envie" data-envie="${i}" ${bg(photoOf(items,i))}><div class="t"><h3>${e.t}</h3><p>${e.s} · ${items.length}</p></div></button>`).join("")}</div></section>
 <section class="sec"><div class="sec-h"><h2>Par cuisine</h2><button class="all" data-allcats>Tout voir ›</button></div>
  <div class="rail">${cats.slice(0,10).map(([n,v],i)=>`<button class="tile cuis" data-cat="${esc(n)}" ${bg(photoOf(P.filter(p=>p.cat===n),i))}><div class="t"><h3>${esc(n)}</h3><p>${v} adresses</p></div></button>`).join("")}</div></section>
 ${k||h?`<section class="sec"><div class="sec-h"><h2>Régimes</h2></div><div class="diet">${k?`<button data-diet="kasher"><span class="seal" style="background:#1d3b78">K</span><span><b>Kasher</b><small>${k} adresses</small></span></button>`:""}${h?`<button data-diet="halal"><span class="seal" style="background:#2c7a4b">H</span><span><b>Halal</b><small>${h} adresses</small></span></button>`:""}</div></section>`:""}
 <section class="sec"><button class="collection" data-toggle-prec ${bg(precImg)}><div class="t"><small>${S.prec?"Tu es dans":"Haut de gamme"}</small><h3>La Collection</h3><p>${S.prec?"Touche pour revenir aux adresses du quotidien.":"Grandes tables, rooftops, bars d'exception. L'appli passe en noir et or."}</p><span class="go">${S.prec?"Quitter":"Entrer"}</span></div></button></section>
 <section class="sec"><div class="sec-h"><h2>Choisis le nom</h2><span>touche pour l'essayer</span></div>
  <div class="names">${NAMES.map((x,i)=>`<button class="name ${i===S.name?"on":""}" data-name="${i}"><h3>${esc(x.n)}</h3><p>${esc(x.d)}</p></button>`).join("")}</div></section>
 <p class="proto">Maquette · ton appli actuelle n'est pas modifiée</p>`;}
function grouped(items){const g={};items.forEach(p=>(g[p.cat||"Autres"]=g[p.cat||"Autres"]||[]).push(p));
 return Object.entries(g).sort((a,b)=>b[1].length-a[1].length).map(([cat,arr],i)=>`<div class="subhead" style="--sc:${PAL[i%PAL.length]}"><h3>${esc(cat)}</h3><i></i><span>${arr.length}</span></div><div class="cards">${arr.map(card).join("")}</div>`).join("")}
function renderList(){const P=pool(),L=S.list;let items=P,title="",body="";
 if(L.allcats){const cats=Object.entries(P.reduce((a,p)=>(p.cat&&(a[p.cat]=(a[p.cat]||0)+1),a),{})).sort((a,b)=>b[1]-a[1]);
  $("#main").innerHTML=`<div class="list-h"><button class="back" data-back>‹</button><h2>Toutes les cuisines</h2></div><div class="grid2">${cats.map(([n,v],i)=>`<button class="tile" data-cat="${esc(n)}" ${bg(photoOf(P.filter(p=>p.cat===n),i))}><div class="t"><h3>${esc(n)}</h3><p>${v}</p></div></button>`).join("")}</div>`;return}
 if(L.zone){items=P.filter(p=>zoneOf(p)===L.zone);title=/^\d+$/.test(L.zone)?`Paris ${arrH(+L.zone)}`:esc(L.zone);body=grouped(items)}
 if(L.envie!=null){items=P.filter(ENVIES[L.envie].f);title=ENVIES[L.envie].t;body=grouped(items)}
 if(L.diet){items=P.filter(p=>p[L.diet]);title=L.diet==="kasher"?"Kasher":"Halal";body=grouped(items)}
 if(L.cat){items=P.filter(p=>p.cat===L.cat);title=esc(L.cat);body=`<div class="cards" style="margin-top:14px">${items.map(card).join("")}</div>`}
 if(L.q!=null){const q=L.q.toLowerCase();items=P.filter(p=>`${p.name} ${p.cat} ${p.address}`.toLowerCase().includes(q));title=L.q?`« ${esc(L.q)} »`:"Toutes les adresses";body=grouped(items)}
 $("#main").innerHTML=`<div style="height:30px"></div><div class="list-h"><button class="back" data-back>‹</button><h2>${title}</h2></div>${body||'<p style="color:var(--muted)">Rien ici pour l\'instant.</p>'}`}
function renderNav(){const it=[["home","Accueil",'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'],["explore","Explorer",'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'],["map","Carte",'<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>'],["love","Mes envies",'<path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/>']];
 $("#nav").innerHTML=it.map(([id,l,ic])=>`<button class="${(id==="home"&&S.view!=="list")||(id==="explore"&&S.view==="list")?"on":""}" data-view="${id}"><svg viewBox="0 0 24 24">${ic}</svg>${l}</button>`).join("")}
function render(){renderHero();S.view==="list"?renderList():renderHome();renderNav()}
const open=l=>{S.list=l;S.view="list";render();scrollTo({top:250,behavior:"smooth"})};
document.addEventListener("click",e=>{const t=e.target;let b;
 if(b=t.closest("[data-city]")){S.city=b.dataset.city;S.view="home";render();scrollTo({top:0,behavior:"smooth"});return}
 if(t.closest("[data-dark]")){S.dark=!S.dark;render();return}
 if(b=t.closest("[data-zone]"))return open({zone:b.dataset.zone});
 if(b=t.closest("[data-envie]"))return open({envie:+b.dataset.envie});
 if(b=t.closest("[data-diet]"))return open({diet:b.dataset.diet});
 if(b=t.closest("[data-cat]"))return open({cat:b.dataset.cat});
 if(t.closest("[data-allcats]"))return open({allcats:1});
 if(t.closest("[data-toggle-prec]")){S.prec=!S.prec;S.view="home";render();scrollTo({top:0,behavior:"smooth"});return}
 if(b=t.closest("[data-name]")){S.name=+b.dataset.name;render();return}
 if(t.closest("[data-back]")){S.view="home";render();return}
 if(b=t.closest("[data-view]")){const v=b.dataset.view;if(v==="home"){S.view="home";render()}else if(v==="explore")open({q:""});else alert("Dans la maquette, seuls Accueil et Explorer sont cliquables.");}});
document.addEventListener("keydown",e=>{if(e.target.id==="q"&&e.key==="Enter")open({q:e.target.value.trim()})});
fetch("../data/places.json").then(r=>r.json()).then(p=>{S.places=p.filter(x=>!x.removed);render()}).catch(render);
render();
</script>
</body>
</html>
