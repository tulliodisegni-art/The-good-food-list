name: Vérifier la carte

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verif:
    runs-on: ubuntu-latest
    steps:
      - name: Le plan accepte-t-il la lecture par morceaux ?
        run: |
          curl -sS -o /dev/null -D - -H "Range: bytes=0-126" https://tulliodisegni-art.github.io/The-good-food-list/tiles/paris.pmtiles
      - name: Capture de l'onglet Carte en ligne
        run: |
          mkdir verif && cd verif
          npm init -y > /dev/null
          npm install playwright@1.48.2 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          cat > shot.js <<'EOF'
          const { chromium } = require("playwright");
          (async () => {
            const b = await chromium.launch();
            const pg = await b.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 2 });
            pg.on("console", (m) => console.log("console:", m.text()));
            pg.on("requestfailed", (r) => console.log("échec:", r.url().slice(0, 120), r.failure()?.errorText));
            await pg.goto("https://tulliodisegni-art.github.io/The-good-food-list/#carte", { waitUntil: "networkidle" });
            await pg.waitForTimeout(6000);
            await pg.screenshot({ path: "carte.png" });
            // Itinéraire réel depuis Notre-Dame vers le premier lieu de la liste.
            const ctx2 = await b.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 2, geolocation: { latitude: 48.853, longitude: 2.3499 }, permissions: ["geolocation"] });
            const pg2 = await ctx2.newPage();
            pg2.on("console", (m) => console.log("console2:", m.text()));
            await pg2.goto("https://tulliodisegni-art.github.io/The-good-food-list/#paris", { waitUntil: "networkidle" });
            await pg2.evaluate(() => showRoute(S.places.find((p) => p.lat && p.list === "paris").id));
            await pg2.waitForTimeout(9000);
            console.log("trajets:", await pg2.evaluate(() => JSON.stringify(Object.fromEntries(Object.entries(RT.res).map(([k, v]) => [k, v && Math.round(v.min)])))));
            await pg2.screenshot({ path: "route.png" });
            await b.close();
          })();
          EOF
          node shot.js
      - name: Garder la capture sur la branche verif
        run: |
          cd verif
          git init -q -b verif && git add carte.png route.png
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Capture de la carte"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" verif
