name: TLV lookup (temporaire)
on:
  push:
    branches: [claude/project-thread-4261q9]
    paths: [scripts/tlv_list.json, scripts/tlv_lookup.mjs, .github/workflows/tlv-lookup.yml]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/tlv_lookup.mjs
      - run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add scripts/tlv_result.json && git commit -m "TLV : résultats de la vérification" && git push
