name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Chaque matin : un nouveau lot de fiches complétées (photos, téléphones…).
    - cron: "17 5 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Assembler les listes (notes + adresses publiées depuis l'appli)
        run: python3 scripts/build_data.py
      - name: Placer les adresses sur la carte
        run: node scripts/geocode.mjs
      - name: Téléphones et sites depuis OpenStreetMap
        continue-on-error: true
        run: node scripts/osm.mjs
      - name: Sites, comptes Instagram et pages TheFork par recherche web
        continue-on-error: true
        timeout-minutes: 20
        run: node scripts/search.mjs
      - name: Photos et téléphones depuis les sites des restos
        run: node scripts/enrich.mjs
      - name: Vérifier les liens de réservation
        continue-on-error: true
        timeout-minutes: 15
        run: node scripts/check_links.mjs
      - name: Compléter avec Google Places
        env:
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
        run: node scripts/google_places.mjs
      - name: Garder les infos trouvées dans le dépôt
        run: |
          if ! git diff --quiet data/places.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Infos des restos mises à jour automatiquement" data/places.json
            # Si une autre mise à jour est arrivée entre-temps, on garde les infos trouvées ici sans bloquer la mise en ligne.
            (git pull --rebase -q -X theirs origin main && git push) || { git rebase --abort 2>/dev/null; echo "Infos non enregistrées dans le dépôt, retentées au prochain passage"; }
          fi
      - name: Mois en cours
        id: month
        run: echo "m=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: tiles/paris.pmtiles
          key: paris-pmtiles-v1-${{ steps.month.outputs.m }}
      - name: Fond de carte de Paris (hébergé avec l'appli)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tiles
          if [ ! -s tiles/paris.pmtiles ]; then
            gh release download -R protomaps/go-pmtiles -p '*Linux_x86_64.tar.gz' -O pmtiles.tgz
            tar xzf pmtiles.tgz pmtiles
            for i in $(seq 0 10); do
              D=$(date -u -d "-$i day" +%Y%m%d)
              if curl -sfI "https://build.protomaps.com/$D.pmtiles" > /dev/null; then break; fi
            done
            echo "Carte du $D"
            ./pmtiles extract "https://build.protomaps.com/$D.pmtiles" tiles/paris.pmtiles --bbox=2.15,48.76,2.55,48.95 --maxzoom=15
            rm -f pmtiles pmtiles.tgz
          fi
          ls -la tiles
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
