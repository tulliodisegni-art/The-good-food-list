name: Photos des villes (candidates)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/city_photos.mjs
      - name: Déposer sur la branche photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan photos-tmp
          git rm -rfq --cached . >/dev/null
          git add photos
          git commit -qm "Photos candidates"
          git push -f origin photos-tmp:photos
